<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Markdown Editor</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Consolas, "Malgun Gothic", sans-serif;
        background-color: #f8f9fa;
        color: #333;
    }

    header {
        height: 50px;
        background: #2d3436;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 15px;
        gap: 10px;
    }

    header button {
        padding: 6px 12px;
        background: #636e72;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.2s;
    }

    header button:hover {
        background: #2b3031;
    }

    #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 8px 15px;
        background: #f1f2f6;
        border-bottom: 1px solid #dcdde1;
    }

    #toolbar button {
        padding: 6px 10px;
        background: white;
        border: 1px solid #dcdde1;
        border-radius: 4px;
        cursor: pointer;
        min-width: 40px;
        font-size: 13px;
        transition: background 0.2s;
    }

    #toolbar button:hover {
        background: #dfe4ea;
    }

    main {
        flex: 1;
        display: flex;
        overflow: hidden;
    }

    #editor {
        width: 50%;
        resize: none;
        border: none;
        outline: none;
        padding: 20px;
        font-size: 15px;
        font-family: Consolas, monospace;
        line-height: 1.6;
        background: #ffffff;
    }

    #preview {
        width: 50%;
        border-left: 1px solid #dcdde1;
        padding: 20px;
        overflow: auto;
        background: #ffffff;
    }

    /* Preview Markdown Styling */
    #preview h1 { border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px; }
    #preview h2 { border-bottom: 1px solid #eee; margin-top: 20px; margin-bottom: 12px; padding-bottom: 6px; }
    #preview h3 { margin-top: 15px; margin-bottom: 10px; }
    #preview p { line-height: 1.8; margin: 10px 0; }
    #preview pre { background: #2d2d2d; color: white; padding: 15px; border-radius: 6px; overflow: auto; margin: 15px 0; }
    #preview code { background: #f1f2f6; padding: 2px 6px; border-radius: 4px; font-family: Consolas, monospace; font-size: 14px; }
    #preview pre code { background: transparent; padding: 0; }
    #preview blockquote { border-left: 4px solid #4CAF50; padding-left: 12px; color: #666; margin: 15px 0; }
    #preview table { border-collapse: collapse; width: 100%; margin: 15px 0; }
    #preview table th, #preview table td { border: 1px solid #dcdde1; padding: 8px 12px; }
    #preview table th { background: #f1f2f6; }
    #preview img { max-width: 100%; }
    #preview ul, #preview ol { margin-left: 20px; margin-bottom: 10px; }

    /* Modal Styling */
    #shortcut-modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background: white;
        padding: 25px;
        border-radius: 8px;
        width: 450px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 15px; }
    .shortcut-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 14px;
    }
    .shortcut-row input {
        padding: 4px 8px;
        width: 120px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-align: center;
    }
    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<header>
    <button id="btn-open">파일열기</button>
    <button id="btn-save">저장</button>
    <button id="btn-html">HTML 내보내기</button>
    <button id="btn-shortcuts">단축키 설정</button>
    <input type="file" id="file-input" accept=".md,.txt" style="display:none;">
</header>

<div id="toolbar">
    <button onclick="triggerAction('bold')" title="굵게"><b>B</b></button>
    <button onclick="triggerAction('italic')" title="기울임"><i>I</i></button>
    <button onclick="triggerAction('strikethrough')" title="취소선"><s>S</s></button>
    <button onclick="triggerAction('h1')" title="제목 1">H1</button>
    <button onclick="triggerAction('h2')" title="제목 2">H2</button>
    <button onclick="triggerAction('h3')" title="제목 3">H3</button>
    <button onclick="triggerAction('ul')" title="글머리 기호">•</button>
    <button onclick="triggerAction('ol')" title="번호 매기기">1.</button>
    <button onclick="insert('- [ ] ')" title="체크박스">☑</button>
    <button onclick="triggerAction('code')" title="코드 블록">&lt;/&gt;</button>
    <button onclick="table()" title="표 삽입">표</button>
    <button onclick="triggerAction('link')" title="링크">링크</button>
    <button onclick="image()" title="이미지">이미지</button>
</div>

<main>
    <textarea id="editor"># Markdown 에디터

여기에 마크다운을 입력하세요.
상단의 '단축키 설정' 버튼을 눌러 원하는 키로 단축키를 변경할 수 있습니다.
</textarea>
    <div id="preview"></div>
</main>

<!-- 단축키 설정 모달 -->
<div id="shortcut-modal">
    <div class="modal-content">
        <h3>단축키 사용자 지정</h3>
        <div id="shortcut-list"></div>
        <div class="modal-buttons">
            <button id="btn-reset-shortcut" style="background:#d63031;">초기화</button>
            <button id="btn-close-modal" style="background:#b2bec3;">닫기</button>
            <button id="btn-save-shortcut" style="background:#0984e3;">저장</button>
        </div>
    </div>
</div>

<script>
const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const fileInput = document.getElementById("file-input");

marked.setOptions({ breaks: true, gfm: true });

function render() {
    preview.innerHTML = marked.parse(editor.value);
}

editor.addEventListener("input", render);
render();

// 기본 단축키 설정 구조 (콤보 조합 방식)
const defaultShortcuts = {
    bold: { name: "굵게 (Bold)", key: "b", ctrl: true, shift: false, alt: false },
    italic: { name: "기울임 (Italic)", key: "i", ctrl: true, shift: false, alt: false },
    strikethrough: { name: "취소선", key: "s", ctrl: true, shift: true, alt: false },
    h1: { name: "제목 1", key: "1", ctrl: false, shift: false, alt: true },
    h2: { name: "제목 2", key: "2", ctrl: false, shift: false, alt: true },
    h3: { name: "제목 3", key: "3", ctrl: false, shift: false, alt: true },
    ul: { name: "글머리 기호", key: "8", ctrl: false, shift: true, alt: false },
    ol: { name: "번호 매기기", key: "7", ctrl: false, shift: true, alt: false },
    code: { name: "코드 블록", key: "c", ctrl: false, shift: true, alt: false },
    link: { name: "링크", key: "k", ctrl: true, shift: false, alt: false },
    save: { name: "파일 저장", key: "s", ctrl: true, shift: false, alt: false }
};

let userShortcuts = JSON.parse(localStorage.getItem("markdown_shortcuts")) || JSON.parse(JSON.stringify(defaultShortcuts));

// 에디터 액션 함수 매핑
function triggerAction(action) {
    if (action === "bold") wrap("**", "**");
    else if (action === "italic") wrap("*", "*");
    else if (action === "strikethrough") wrap("~~", "~~");
    else if (action === "h1") heading(1);
    else if (action === "h2") heading(2);
    else if (action === "h3") heading(3);
    else if (action === "ul") insert("- ");
    else if (action === "ol") insert("1. ");
    else if (action === "code") codeBlock();
    else if (action === "link") link();
    else if (action === "save") downloadMarkdown();
}

function wrap(left, right) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const text = editor.value;
    const selected = text.substring(start, end);

    editor.value = text.substring(0, start) + left + selected + right + text.substring(end);
    editor.setSelectionRange(start + left.length, end + left.length);
    render();
    editor.focus();
}

function heading(level) { insert("#".repeat(level) + " "); }
function insert(str) {
    const pos = editor.selectionStart;
    const text = editor.value;
    editor.value = text.substring(0, pos) + str + text.substring(pos);
    editor.selectionStart = editor.selectionEnd = pos + str.length;
    render();
    editor.focus();
}
function codeBlock() { insert("```javascript\n\n```\n"); }
function table() { insert(`| 제목1 | 제목2 |\n| --- | --- |\n| 내용1 | 내용2 |\n\n`); }
function link() { insert("[링크이름](https://)"); }
function image() { insert("![이미지설명](image.png)"); }

function downloadMarkdown() {
    const blob = new Blob([editor.value], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "document.md";
    a.click();
    URL.revokeObjectURL(a.href);
}

function downloadHTML() {
    const htmlContent = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Export</title></head><body>${preview.innerHTML}</body></html>`;
    const blob = new Blob([htmlContent], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "document.html";
    a.click();
    URL.revokeObjectURL(a.href);
}

document.getElementById("btn-save").addEventListener("click", downloadMarkdown);
document.getElementById("btn-html").addEventListener("click", downloadHTML);
document.getElementById("btn-open").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => { editor.value = event.target.result; render(); };
    reader.readAsText(file);
    fileInput.value = "";
});

// 단축키 설정 모달 제어
const modal = document.getElementById("shortcut-modal");
const shortcutListDiv = document.getElementById("shortcut-list");

document.getElementById("btn-shortcuts").addEventListener("click", () => {
    openShortcutModal();
    modal.style.display = "flex";
});
document.getElementById("btn-close-modal").addEventListener("click", () => modal.style.display = "none");

function openShortcutModal() {
    shortcutListDiv.innerHTML = "";
    for (let key in userShortcuts) {
        let sc = userShortcuts[key];
        let comboStr = (sc.ctrl ? "Ctrl+" : "") + (sc.shift ? "Shift+" : "") + (sc.alt ? "Alt+" : "") + sc.key.toUpperCase();
        
        let row = document.createElement("div");
        row.className = "shortcut-row";
        row.innerHTML = `
            <span>${sc.name}</span>
            <input type="text" data-action="${key}" value="${comboStr}" readonly placeholder="키 입력">
        `;
        shortcutListDiv.appendChild(row);
    }

    // 인풋 클릭 시 새로운 키 조합 입력 받기
    let inputs = shortcutListDiv.querySelectorAll("input");
    inputs.forEach(input => {
        input.addEventListener("keydown", (e) => {
            e.preventDefault();
            if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
            
            let ctrl = e.ctrlKey || e.metaKey;
            let shift = e.shiftKey;
            let alt = e.altKey;
            let k = e.key.toLowerCase();

            let comboStr = (ctrl ? "Ctrl+" : "") + (shift ? "Shift+" : "") + (alt ? "Alt+" : "") + k.toUpperCase();
            input.value = comboStr;
            
            let action = input.getAttribute("data-action");
            userShortcuts[action].key = k;
            userShortcuts[action].ctrl = ctrl;
            userShortcuts[action].shift = shift;
            userShortcuts[action].alt = alt;
        });
    });
}

document.getElementById("btn-save-shortcut").addEventListener("click", () => {
    localStorage.setItem("markdown_shortcuts", JSON.stringify(userShortcuts));
    alert("단축키가 저장되었습니다.");
    modal.style.display = "none";
});

document.getElementById("btn-reset-shortcut").addEventListener("click", () => {
    if (confirm("단축키를 기본값으로 초기화하시겠습니까?")) {
        localStorage.removeItem("markdown_shortcuts");
        userShortcuts = JSON.parse(JSON.stringify(defaultShortcuts));
        openShortcutModal();
    }
});

// 키보드 이벤트 (사용자 지정 단축키 반영)
editor.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        if (e.shiftKey) {
            const before = editor.value.substring(0, start);
            if (before.endsWith("    ")) {
                editor.value = editor.value.substring(0, start - 4) + editor.value.substring(start);
                editor.selectionStart = editor.selectionEnd = start - 4;
            }
        } else {
            editor.setRangeText("    ", start, end, "end");
        }
        render();
        return;
    }

    // 사용자 정의 단축키 매칭 확인
    for (let action in userShortcuts) {
        let sc = userShortcuts[action];
        let matchCtrl = !!(e.ctrlKey || e.metaKey) === sc.ctrl;
        let matchShift = !!e.shiftKey === sc.shift;
        let matchAlt = !!e.altKey === sc.alt;
        let matchKey = e.key.toLowerCase() === sc.key.toLowerCase();

        if (matchCtrl && matchShift && matchAlt && matchKey) {
            e.preventDefault();
            triggerAction(action);
            return;
        }
    }
});
</script>

</body>
</html>
